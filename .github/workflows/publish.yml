name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination registry
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e games/resgate
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s games/resgate/tests
      - run: python tutorials/first_game/main.py --verify
      - run: python -m resgate --self-test --data-dir artifacts/publish-check
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Require matching release tag for production
        if: inputs.target == 'pypi'
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['GITHUB_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Select the tag v' + version + ' before publishing to PyPI.')
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_public_package.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
